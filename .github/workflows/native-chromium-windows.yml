name: Native Chromium Windows Build

# No `uses:` anywhere. Actions are downloaded from codeload.github.com during
# `Set up job`, and this account is rate-limited there: runs 13 and 14 both
# died with HTTP 429 after three retries, before any step of ours executed.
# The runner is the owner's own machine and already has git and python for the
# Chromium build itself.
#
# The installer is not uploaded as an artifact for the same reason, and for a
# second one: the runner *is* the owner's machine, so uploading 122 MB to
# GitHub storage -- which is billed on a private repository -- only to download
# it back to the machine that produced it is cost with no delivery.
on:
  workflow_dispatch:
    inputs:
      ninja_jobs:
        description: "Parallel compile jobs. Blank saturates the machine; set it when the runner is also a workstation."
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: native-chromium-windows
  cancel-in-progress: false

jobs:
  build:
    name: Build Sunshine Chromium on Windows x64
    runs-on: [self-hosted, Windows, X64, sunshine-chromium]
    # The pinned fetch and gclient sync run inside this job, so the budget must
    # cover source acquisition as well as the optimised build and its LTO link.
    # A self-hosted runner has no upper job limit; an early finish costs nothing.
    timeout-minutes: 1440

    steps:
      # The token reaches git through the remote URL rather than `.git/config`,
      # so it is not left on disk afterwards.
      - name: Check out Sunshine downstream
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          if (-not (Test-Path ".git")) { git init -q . }
          git fetch --no-tags --depth=1 "https://x-access-token:$env:GH_TOKEN@github.com/$env:GITHUB_REPOSITORY.git" $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { throw "git fetch failed" }
          git checkout -q --detach FETCH_HEAD
          if ($LASTEXITCODE -ne 0) { throw "git checkout failed" }
          git clean -qffd

      - name: Build pinned native Chromium
        shell: pwsh
        env:
          SUNSHINE_CHROMIUM_WORKSPACE: ${{ vars.SUNSHINE_CHROMIUM_WORKSPACE }}
          SUNSHINE_NINJA_JOBS: ${{ inputs.ninja_jobs }}
          # The account link's OAuth client, if this repository has been given
          # one. A secret rather than a variable: the id is public by Google's
          # own account of installed apps, but a secret is redacted from logs
          # and a variable is not, and nothing is gained by watching it scroll
          # past. Unset resolves to the empty string, and the build then makes
          # a browser with no account link -- which is what every build from
          # this repository does today and what any fork will keep doing.
          SUNSHINE_ACCOUNT_CLIENT_ID: ${{ secrets.SUNSHINE_ACCOUNT_CLIENT_ID }}
        run: ./scripts/build_chromium_windows.ps1

      # The first check in this project that reads the output rather than the
      # source: artifacts, the configuration the build actually used, and what
      # Windows believes about URL schemes.
      - name: Verify the built browser matches the contracts
        env:
          SUNSHINE_CHROMIUM_WORKSPACE: ${{ vars.SUNSHINE_CHROMIUM_WORKSPACE }}
        run: python scripts/verify_installed_build.py

      # The dialog, with mini_installer.exe inside it. Its own compiler
      # invocation rather than a GN target: it links against nothing Chromium
      # produces except the engine it embeds as a blob, so it does not belong
      # in that build graph, and a dialog change costs a link rather than a
      # browser.
      - name: Build the installer front-end
        env:
          SUNSHINE_CHROMIUM_WORKSPACE: ${{ vars.SUNSHINE_CHROMIUM_WORKSPACE }}
        run: ./scripts/build_installer_frontend.ps1

      # docs/SIZE_BUDGET.md names an installed-bundle threshold that nothing
      # has ever measured: the size report reads chrome.exe, which build #33
      # measured at 4.1 MB because it is a launcher stub. This reads upstream's
      # own shipped-file manifest and sums what the installer actually packs.
      - name: Measure the shipped payload
        env:
          SUNSHINE_CHROMIUM_WORKSPACE: ${{ vars.SUNSHINE_CHROMIUM_WORKSPACE }}
        run: >
          python scripts/measure_shipped_size.py
          --json artifacts\windows-x64\shipped-size.json

      # Where the installer is, rather than a copy of it. The build script has
      # already written it to the runner's own disk.
      - name: Report the installer location
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $directory = Join-Path $env:GITHUB_WORKSPACE "artifacts\windows-x64"
          $installer = Join-Path $directory "sunshine-installer-windows-x64.exe"
          if (-not (Test-Path $installer)) { throw "expected installer is missing: $installer" }
          $megabytes = [math]::Round((Get-Item $installer).Length / 1MB, 1)
          Write-Host "Installer ($megabytes MB): $installer"
          Get-Content (Join-Path $directory "size-report.json")
          # The front-end is a separate artifact from a separate compiler run,
          # and without this a step that silently produced nothing would leave
          # the job green.
          $frontEnd = Join-Path $directory "sunshine-setup.exe"
          if (-not (Test-Path $frontEnd)) { throw "the installer front-end is missing: $frontEnd" }
          $feMegabytes = [math]::Round((Get-Item $frontEnd).Length / 1MB, 1)
          Write-Host "Front-end ($feMegabytes MB): $frontEnd"
          # The uninstall launcher, for the same reason as the line above: it is
          # a third artifact from the same script, and a step that silently
          # produced nothing would otherwise leave the job green.
          $uninstaller = Join-Path $directory "sunshine-uninstall.exe"
          if (-not (Test-Path $uninstaller)) { throw "the uninstall launcher is missing: $uninstaller" }
          $unKilobytes = [math]::Round((Get-Item $uninstaller).Length / 1KB, 1)
          Write-Host "Uninstall launcher ($unKilobytes KB): $uninstaller"
