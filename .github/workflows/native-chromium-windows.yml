name: Native Chromium Windows Build

# No `uses:` anywhere. Actions are downloaded from codeload.github.com during
# `Set up job`, and this account is rate-limited there: runs 13 and 14 both
# died with HTTP 429 after three retries, before any step of ours executed.
# The runner is the owner's own machine and already has git and python for the
# Chromium build itself.
#
# The installer is not uploaded as an artifact for the same reason, and for a
# second one: the runner *is* the owner's machine, so uploading 122 MB to
# GitHub storage -- which is billed on a private repository -- only to download
# it back to the machine that produced it is cost with no delivery.
on:
  workflow_dispatch:
    inputs:
      ninja_jobs:
        description: "Parallel compile jobs. Blank saturates the machine; set it when the runner is also a workstation."
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: native-chromium-windows
  cancel-in-progress: false

jobs:
  build:
    name: Build Sunshine Chromium on Windows x64
    runs-on: [self-hosted, Windows, X64, sunshine-chromium]
    # The pinned fetch and gclient sync run inside this job, so the budget must
    # cover source acquisition as well as the optimised build and its LTO link.
    # A self-hosted runner has no upper job limit; an early finish costs nothing.
    timeout-minutes: 1440

    steps:
      # The token reaches git through the remote URL rather than `.git/config`,
      # so it is not left on disk afterwards.
      - name: Check out Sunshine downstream
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          if (-not (Test-Path ".git")) { git init -q . }
          git fetch --no-tags --depth=1 "https://x-access-token:$env:GH_TOKEN@github.com/$env:GITHUB_REPOSITORY.git" $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { throw "git fetch failed" }
          git checkout -q --detach FETCH_HEAD
          if ($LASTEXITCODE -ne 0) { throw "git checkout failed" }
          git clean -qffd

      - name: Build pinned native Chromium
        shell: pwsh
        env:
          SUNSHINE_CHROMIUM_WORKSPACE: ${{ vars.SUNSHINE_CHROMIUM_WORKSPACE }}
          SUNSHINE_NINJA_JOBS: ${{ inputs.ninja_jobs }}
        run: ./scripts/build_chromium_windows.ps1

      # Where the installer is, rather than a copy of it. The build script has
      # already written it to the runner's own disk.
      - name: Report the installer location
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $directory = Join-Path $env:GITHUB_WORKSPACE "artifacts\windows-x64"
          $installer = Join-Path $directory "sunshine-installer-windows-x64.exe"
          if (-not (Test-Path $installer)) { throw "expected installer is missing: $installer" }
          $megabytes = [math]::Round((Get-Item $installer).Length / 1MB, 1)
          Write-Host "Installer ($megabytes MB): $installer"
          Get-Content (Join-Path $directory "size-report.json")
