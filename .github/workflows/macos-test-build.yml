name: macOS Test Build

on:
  workflow_dispatch:
  pull_request:
    branches: [stable]
    paths:
      - "src/**"
      - "tests/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig*.json"
      - "vite.config.ts"
      - ".github/workflows/macos-test-build.yml"

permissions:
  contents: read

jobs:
  build-universal-macos:
    name: Build unsigned Universal macOS app
    runs-on: macos-14
    timeout-minutes: 30
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Run type checks
        run: npm run typecheck

      - name: Build Universal DMG and ZIP
        run: npm run package:mac

      - name: Upload macOS test build
        uses: actions/upload-artifact@v4
        with:
          name: sunshine-os-macos-universal-unsigned
          path: |
            release/*.dmg
            release/*-mac-universal.zip
          if-no-files-found: error
          retention-days: 14
