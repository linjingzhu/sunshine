name: Chromium Architecture Guard (no full checkout/build)

on:
  workflow_dispatch:
  pull_request:
    branches: [stable]
  push:
    branches: [stable]

permissions:
  contents: read

concurrency:
  group: chromium-architecture-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Chromium checkout and compilation require substantial storage and runner time.
# This intentionally fast guard validates only Sunshine's downstream architecture
# and bootstrap tooling. Platform builds belong in a separate, explicitly funded
# workflow once the native Chromium patch stack is ready for packaging.
jobs:
  architecture-guard:
    name: Reject Electron and validate Python tooling
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out Sunshine source only
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Reject excluded wrapper runtimes
        run: python scripts/verify_architecture.py

      - name: Validate exclusive patch ownership
        run: python scripts/patch_manifest.py

      - name: Validate first-party module registry
        run: python scripts/validate_first_party_modules.py

      - name: Validate command registry
        run: python scripts/validate_commands.py

      - name: Compile-check repository Python tools
        shell: bash
        run: |
          mapfile -d '' python_files < <(find scripts -type f -name '*.py' -print0)
          if (( ${#python_files[@]} == 0 )); then
            echo "No Python tools found under scripts/." >&2
            exit 1
          fi
          python -m py_compile "${python_files[@]}"

      - name: Run architecture guard regression tests
        run: python -m unittest discover -s tests -v

      - name: Validate pinned Chromium inputs without downloading Chromium
        shell: bash
        run: |
          grep -Eq '^CHROMIUM_REVISION=[^[:space:]]+$' config/chromium.version
          while IFS= read -r patch || [[ -n "$patch" ]]; do
            [[ -z "$patch" || "$patch" == \#* ]] && continue
            test -f "downstream/patches/$patch" || {
              echo "Missing downstream patch: $patch" >&2
              exit 1
            }
          done < downstream/patches/series

      - name: Verify pinned Chromium tag exists upstream
        shell: bash
        run: |
          revision="$(sed -n 's/^CHROMIUM_REVISION=//p' config/chromium.version)"
          version="${revision#refs/tags/}"
          curl --fail --silent --show-error --location \
            "https://chromium.googlesource.com/chromium/src/+/refs/tags/$version?format=JSON" \
            > /dev/null

      - name: Verify workspace native integration seams
        shell: bash
        run: |
          revision="$(sed -n 's/^CHROMIUM_REVISION=//p' config/chromium.version)"
          version="${revision#refs/tags/}"
          worktree="$(mktemp -d)"
          trap 'rm -rf "$worktree"' EXIT
          paths=(
            chrome/browser/ui/tabs/tab_strip_model.h
            chrome/browser/ui/tabs/tab_group_model.h
            chrome/browser/ui/tabs/tab_strip_model_observer.h
            components/sessions/core/session_types.h
            components/sessions/core/session_service_commands.cc
          )
          for source_path in "${paths[@]}"; do
            target="$worktree/$(basename "$source_path")"
            curl --fail --silent --show-error --location \
              "https://chromium.googlesource.com/chromium/src/+/refs/tags/$version/$source_path?format=TEXT" \
              | base64 --decode > "$target"
          done
          grep -q 'class TabStripModel' "$worktree/tab_strip_model.h"
          grep -q 'class TabGroupModel' "$worktree/tab_group_model.h"
          grep -q 'OnTabStripModelChanged' "$worktree/tab_strip_model_observer.h"
          sed -n '/struct SESSIONS_EXPORT SessionTab {/,/^};/p' \
            "$worktree/session_types.h" | grep -q 'extra_data'
          sed -n '/struct SESSIONS_EXPORT SessionWindow {/,/^};/p' \
            "$worktree/session_types.h" | grep -q 'extra_data'
          grep -q 'CreateAddTabExtraDataCommand' "$worktree/session_service_commands.cc"
          grep -q 'CreateAddWindowExtraDataCommand' "$worktree/session_service_commands.cc"

      - name: Verify the New Tab colour tokens the patch depends on
        shell: bash
        run: |
          revision="$(sed -n 's/^CHROMIUM_REVISION=//p' config/chromium.version)"
          version="${revision#refs/tags/}"
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          fetch() {
            curl --fail --silent --show-error --location \
              "https://chromium.googlesource.com/chromium/src/+/refs/tags/$version/$1?format=TEXT" \
              | base64 --decode > "$work/$2"
          }
          fetch chrome/browser/resources/new_tab_page/app.css app.css
          fetch chrome/browser/ui/color/chrome_color_id.h chrome_color_id.h

          # The wordmark consumes both tokens without a fallback, deliberately: a
          # fallback colour would look right in light mode and silently escape the
          # theme everywhere else. That makes their existence load-bearing.
          #
          # They are different KINDS of token and need different evidence.
          # --ntp-theme-text-shadow is a plain custom property that app.css itself
          # declares, so the definition is the proof. --color-new-tab-page-*
          # tokens are emitted by Chromium's colour pipeline from the colour IDs
          # in chrome_color_id.h and reach the page through chrome://theme, so a
          # token can be perfectly valid while appearing nowhere in app.css. An
          # earlier version of this step grepped app.css for both and would have
          # failed the build on a token that exists.
          #
          # --ntp-logo-margin-bottom needs no check: upstream's own #logo rule
          # sits in the patch context, so applying the patch already proves it.
          missing=0
          if ! grep -q -- '--ntp-theme-text-shadow:' "$work/app.css"; then
            echo "app.css no longer declares --ntp-theme-text-shadow" >&2
            missing=1
          fi
          if ! grep -q 'kColorNewTabPagePrimaryForeground' "$work/chrome_color_id.h"; then
            echo "chrome_color_id.h no longer defines kColorNewTabPagePrimaryForeground" >&2
            echo "(which is what emits --color-new-tab-page-primary-foreground)" >&2
            echo "" >&2
            echo "New Tab Page foreground colour IDs upstream does define:" >&2
            grep -oE 'kColorNewTabPage[A-Za-z0-9]*Foreground' "$work/chrome_color_id.h" | sort -u >&2
            missing=1
          fi
          (( missing == 0 ))

      - name: Check complete patch stack against pinned upstream source
        shell: bash
        run: |
          revision="$(sed -n 's/^CHROMIUM_REVISION=//p' config/chromium.version)"
          version="${revision#refs/tags/}"
          worktree="$(mktemp -d)"
          trap 'rm -rf "$worktree"' EXIT
          mapfile -t upstream_files < <(python scripts/patch_manifest.py --paths)
          if (( ${#upstream_files[@]} == 0 )); then
            echo "Patch manifest returned no upstream targets." >&2
            exit 1
          fi
          for source_path in "${upstream_files[@]}"; do
            mkdir -p "$worktree/$(dirname "$source_path")"
            curl --fail --silent --show-error --location \
              "https://chromium.googlesource.com/chromium/src/+/refs/tags/$version/$source_path?format=TEXT" \
              | base64 --decode > "$worktree/$source_path"
          done
          git -C "$worktree" init --quiet
          git -C "$worktree" add .
          git -C "$worktree" \
            -c user.name=architecture-check \
            -c user.email=architecture-check@localhost \
            commit --quiet -m upstream-inputs
          while IFS= read -r patch || [[ -n "$patch" ]]; do
            [[ -z "$patch" || "$patch" == \#* ]] && continue
            git -C "$worktree" apply --check \
              "$GITHUB_WORKSPACE/downstream/patches/$patch"
            git -C "$worktree" apply \
              "$GITHUB_WORKSPACE/downstream/patches/$patch"
          done < "$GITHUB_WORKSPACE/downstream/patches/series"
