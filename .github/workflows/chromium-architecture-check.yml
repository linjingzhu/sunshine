name: Chromium Architecture Guard (no full checkout/build)

on:
  workflow_dispatch:
  pull_request:
    branches: [stable]
  push:
    branches: [stable]

permissions:
  contents: read

concurrency:
  group: chromium-architecture-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Chromium checkout and compilation require substantial storage and runner time.
# This intentionally fast guard validates only Sunshine's downstream architecture
# and bootstrap tooling. Platform builds belong in a separate, explicitly funded
# workflow once the native Chromium patch stack is ready for packaging.
jobs:
  architecture-guard:
    name: Reject Electron and validate Python tooling
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out Sunshine source only
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Reject excluded wrapper runtimes
        run: python scripts/verify_architecture.py

      - name: Validate exclusive patch ownership
        run: python scripts/patch_manifest.py

      - name: Validate first-party module registry
        run: python scripts/validate_first_party_modules.py

      - name: Validate command registry
        run: python scripts/validate_commands.py

      - name: Validate policy document metadata and references
        run: python scripts/validate_doc_metadata.py

      - name: Verify the build cannot acquire an account identity
        run: python scripts/verify_account_freedom.py

      - name: Verify Sunshine interposes on nothing Chromium owns
        run: python scripts/verify_no_interposition.py

      - name: Verify first-party surfaces do not collide or duplicate
        run: python scripts/verify_first_party_surfaces.py

      - name: Verify Sunshine-authored CSS against the design system
        run: python scripts/verify_design_tokens.py

      - name: Trace contract invariant coverage
        run: python scripts/trace_invariants.py

      - name: Compile-check repository Python tools
        run: python scripts/compile_check.py

      - name: Run architecture guard regression tests
        run: python -m unittest discover -s tests -v

      - name: Verify the pinned revision still supports the patch stack
        # Seams, New Tab tokens, and patch application against the pinned
        # revision. This was three bash steps; the token one asked app.css
        # whether a colour-pipeline token existed and would have failed the
        # build on a token that does. One implementation can be tested.
        run: python scripts/verify_pinned_upstream.py
